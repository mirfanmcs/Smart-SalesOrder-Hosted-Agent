name: Deploy Order Management Agent

on:
  #push:
  #  paths:
  #    - 'Agents/**'
  #    - 'requirements.txt'
  #    - 'Agents/.env.example'
  #    - '.github/workflows/deploy-order-management-agent.yaml'
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2.1.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_AGENT_DEPLOY }}

      - name: Build and push hosted agent image
        id: build-image
        working-directory: .
        shell: bash
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "order-management-agent:${{ github.sha }}" \
            --platform linux/amd64 \
            Agents

          ACR_LOGIN_SERVER=$(az acr show \
            --name "${{ vars.ACR_NAME }}" \
            --query loginServer \
            --output tsv)

          echo "image=${ACR_LOGIN_SERVER}/order-management-agent:${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

  Deploy:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create agent environment file from secret
        run: |
          if [[ -z "$AGENT_ENV" ]]; then
            echo "::error::Repository secret ENV is empty or unavailable."
            exit 1
          fi

          printf "%s\n" "$AGENT_ENV" > Agents/.env

          for setting in PROJECT_ENDPOINT DEPLOYMENT_NAME; do
            if ! grep -qE "^${setting}=.+" Agents/.env; then
              echo "::error::Repository secret ENV is missing ${setting}."
              exit 1
            fi
          done
        shell: bash
        env:
          AGENT_ENV: ${{ secrets.ENV }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Login to Azure
        uses: azure/login@v2.1.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_AGENT_DEPLOY }}

      - name: Install deployment dependencies
        working-directory: .
        run: python -m pip install --requirement requirements.txt

      - name: Register hosted agent version with Python SDK
        working-directory: .
        run: |
          python Agents/deploy_hosted_agent.py \
            --image "${{ needs.Build.outputs.image }}"
